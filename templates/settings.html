<!-- settings.html -->
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no, address=no, email=no">
  <title>Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/journal.css') }}">
</head>
<body>
  {% include "_sidebar.html" %}

  <div class="container">
    <h1>Settings</h1>

    <form class="glass-box" method="post" style="max-width:420px;">
      <p style="margin-bottom:14px;">الان با یوزرنیم <strong>{{ username }}</strong> واردی</p>

      <label>رمز فعلی</label>
      <input type="password" name="current_password" required>

      <div style="height:12px;"></div>

      <label>نام کاربری جدید</label>
      <input type="text" name="new_username" value="{{ username }}" required>

      <div style="height:12px;"></div>

      <label>رمز جدید (اگه خالی بذاری، رمز عوض نمیشه)</label>
      <input type="password" name="new_password">

      <div style="height:16px;"></div>
      <button type="submit" class="j-btn-save">ذخیره تغییرات</button>
    </form>

    {% if error %}<p style="color:#ff6b6b;margin-top:10px;">{{ error }}</p>{% endif %}
    {% if success %}<p style="color:#28d9a0;margin-top:10px;">{{ success }}</p>{% endif %}
  </div>
</body>
</html>
