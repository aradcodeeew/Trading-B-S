<!-- journal_strategy_fields.html -->
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no, address=no, email=no">
  <title>{{ strategy.name }} - Boxes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/journal.css') }}">
</head>
<body class="journal-page">

  {% include "_sidebar.html" %}

  <div class="container">
    <h1>{{ strategy.name }} — Boxes</h1>
    <div class="j-icon-row">
      <a href="/journal/strategies" class="j-icon-btn" title="برگشت به استراتژی‌ها">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M19 12H5M5 12l6-6M5 12l6 6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <form class="glass-box j-field-edit" method="post" action="/journal/strategies/{{ strategy.id }}/fields/add">
      <h3>Add New Box</h3>
      <div class="j-field-row">
        <div>
          <label>Box name</label>
          <input type="text" name="label" placeholder="e.g. back context" required>
        </div>
        <div>
          <label>Type</label>
          <select name="type" onchange="toggleOptions(this)">
            <option value="text">Free text</option>
            <option value="select">Select (dropdown)</option>
          </select>
        </div>
      </div>
      <div class="j-options-wrap" style="display:none;">
        <label>Options (one per line)</label>
        <textarea name="options" rows="4" placeholder="spike up&#10;spike down&#10;Range"></textarea>
      </div>
      <button type="submit" class="j-btn-add">Add Box</button>
    </form>

    <hr class="j-divider">

    {% if fields %}
      {% for f in fields %}
        <form class="glass-box j-field-edit" method="post" action="/journal/strategies/{{ strategy.id }}/fields/edit/{{ f.id }}">
          <div class="j-field-row">
            <div>
              <label>Box name</label>
              <input type="text" name="label" value="{{ f.label }}" required>
            </div>
            <div>
              <label>Type</label>
              <select name="type" onchange="toggleOptions(this)">
                <option value="text" {% if f.type == 'text' %}selected{% endif %}>Free text</option>
                <option value="select" {% if f.type == 'select' %}selected{% endif %}>Select (dropdown)</option>
              </select>
            </div>
          </div>
          <div class="j-options-wrap" style="{% if f.type != 'select' %}display:none;{% endif %}">
            <label>Options (one per line)</label>
            <textarea name="options" rows="4">{{ f.options|join('\n') }}</textarea>
          </div>
          <div class="j-field-actions">
            <button type="submit" class="j-btn-save">Save Changes</button>
          </div>
        </form>
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:20px;">
          <form method="post" action="/journal/strategies/{{ strategy.id }}/fields/move/{{ f.id }}/up">
            <button type="submit" class="j-icon-btn" style="width:34px;height:34px;" title="بالا" {% if loop.first %}disabled{% endif %}>↑</button>
          </form>
          <form method="post" action="/journal/strategies/{{ strategy.id }}/fields/move/{{ f.id }}/down">
            <button type="submit" class="j-icon-btn" style="width:34px;height:34px;" title="پایین" {% if loop.last %}disabled{% endif %}>↓</button>
          </form>
          <form method="post" action="/journal/strategies/{{ strategy.id }}/fields/delete/{{ f.id }}"
                onsubmit="return confirm('Delete this box?');" style="flex:1;">
            <button type="submit" class="j-btn-delete" style="width:100%;">Delete This Box</button>
          </form>
        </div>
      {% endfor %}
    {% else %}
      <p class="j-empty">No boxes yet for this strategy — add one above.</p>
    {% endif %}
  </div>

  <script>
    function toggleOptions(select) {
      const wrap = select.closest("form").querySelector(".j-options-wrap");
      wrap.style.display = select.value === "select" ? "block" : "none";
    }
  </script>

</body>
</html>
